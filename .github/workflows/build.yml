name: Build and Push Docker Images

on:
  push:
    branches: [main, devops]
    paths:
      - 'Dockerfile.*'
      - 'src/**'
      - 'frontend/**'
      - 'pyproject.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'alembic/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: bot
            dockerfile: Dockerfile.bot
            context: .
          - service: api
            dockerfile: Dockerfile.api
            context: .
          - service: frontend
            dockerfile: Dockerfile
            context: ./frontend/app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/systech-aidd-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/systech-aidd-${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/systech-aidd-${{ matrix.service }}:buildcache,mode=max

      - name: Security check - Verify no secrets in image
        run: |
          echo "🔒 Проверка безопасности образа: ${{ matrix.service }}"

          # Pull образа для проверки
          docker pull ghcr.io/${{ github.repository_owner }}/systech-aidd-${{ matrix.service }}:latest

          # Проверка что .env файлов нет в образе
          echo "Checking for .env files..."
          if docker run --rm ghcr.io/${{ github.repository_owner }}/systech-aidd-${{ matrix.service }}:latest find / -name ".env*" 2>/dev/null | grep -q ".env"; then
            echo "❌ ERROR: .env files found in image!"
            exit 1
          else
            echo "✅ No .env files found - OK"
          fi

          # Проверка что ключевых слов секретов нет в переменных окружения образа
          echo "Checking environment variables..."
          ENV_VARS=$(docker image inspect ghcr.io/${{ github.repository_owner }}/systech-aidd-${{ matrix.service }}:latest --format='{{json .Config.Env}}')
          if echo "$ENV_VARS" | grep -qiE "(password|token|secret|key)=.+"; then
            echo "⚠️  WARNING: Possible secrets in environment variables"
            echo "$ENV_VARS" | grep -iE "(password|token|secret|key)="
          else
            echo "✅ No obvious secrets in ENV - OK"
          fi

          echo "✅ Security check passed for ${{ matrix.service }}"

      - name: Image summary
        run: |
          echo "## 📦 Image: ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry:** ghcr.io/${{ github.repository_owner }}/systech-aidd-${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags:** ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** $(docker image inspect ghcr.io/${{ github.repository_owner }}/systech-aidd-${{ matrix.service }}:latest --format='{{.Size}}' | numfmt --to=iec)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

