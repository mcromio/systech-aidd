version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: llm-assistant-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llm_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-llm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llm_password_dev}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llm_user} -d ${POSTGRES_DB:-llm_assistant}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - llm-network

  # Telegram Bot
  bot:
    image: ghcr.io/mcromio/systech-aidd-bot:latest
    container_name: llm-assistant-bot
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-llm_user}:${POSTGRES_PASSWORD:-llm_password_dev}@postgres:5432/${POSTGRES_DB:-llm_assistant}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - llm-network

  # FastAPI Backend
  api:
    image: ghcr.io/mcromio/systech-aidd-api:latest
    container_name: llm-assistant-api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-llm_user}:${POSTGRES_PASSWORD:-llm_password_dev}@postgres:5432/${POSTGRES_DB:-llm_assistant}

    ports:
      - "8000:8000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - llm-network

  # Next.js Frontend
  frontend:
    image: ghcr.io/mcromio/systech-aidd-frontend:latest
    container_name: llm-assistant-frontend
    restart: unless-stopped

    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - API_HOST=http://api:8000

    ports:
      - "3000:3000"

    depends_on:
      api:
        condition: service_healthy

    networks:
      - llm-network

volumes:
  postgres_data:
    driver: local

networks:
  llm-network:
    driver: bridge

