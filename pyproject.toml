[project]
name = "systech-aidd-mcr"
version = "0.1.0"
description = "LLM Assistant Telegram Bot with Wikipedia integration"
authors = [
    {name = "Your Name", email = "your-email@example.com"}
]
# readme = "README.md"  # Временно отключено для Docker build (D0 MVP)
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}

dependencies = [
    "aiogram>=3.13.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "beautifulsoup4>=4.12.0",
    "duckduckgo-search>=8.1.1",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "openai>=1.51.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "pytz>=2025.2",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn>=0.31.0",
    "wikipedia-api>=0.7.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-pytz>=2025.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = false
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = ["aiogram.*", "wikipediaapi.*", "duckduckgo_search.*", "alembic.*", "sqlalchemy.*", "fastapi.*"]
ignore_missing_imports = true

